    <script>
    let collapsed = window.innerWidth < 768;
    function toggleInfo(){
      const panel=document.getElementById("infoPanel");
      const arrow=document.getElementById("infoArrow");
      collapsed=!collapsed;
      panel.classList.toggle("collapsed");
      arrow.textContent = collapsed ? "▲" : "▼";
    }
    if(collapsed){
      document.getElementById("infoPanel").classList.add("collapsed");
      document.getElementById("infoArrow").textContent="▲";
    }
    </script>
